name: Daily Crypto Signal

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-crypto
  cancel-in-progress: false

jobs:
  send-crypto-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crypto signal job
        env:
          CRYPTO_BOT_TOKEN: ${{ secrets.CRYPTO_BOT_TOKEN }}
          CRYPTO_CHANNEL_ID: ${{ secrets.CRYPTO_CHANNEL_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python crypto_main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update crypto signals state [skip ci]"
          git pull --rebase
          git push
