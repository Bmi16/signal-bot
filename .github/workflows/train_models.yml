name: Train ML Models

on:
  schedule:
    - cron: "0 3 * * 0"        # every Sunday 03:00 UTC: retrain with the week's real outcomes
  workflow_dispatch: {}          # run once manually to create the first models

permissions:
  contents: write

concurrency:
  group: train-models
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train forex model
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python train.py forex

      - name: Train crypto model
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python train.py crypto

      - name: Commit models and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models
          git diff --cached --quiet || git commit -m "Update ML models [skip ci]"
          git pull --rebase
          git push
